<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>金鶯減重診所｜預約系統 v10</title>
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
:root{--navy:#1e2a3a;--blue:#3b82f6;--purple:#6d28d9;--green:#16a34a;--amber:#f59e0b;--red:#dc2626;
--bg:#f1f5f9;--card:#fff;--txt:#0f172a;--txt2:#475569;--txt3:#94a3b8;--line:#e2e8f0;--r:12px}
*{box-sizing:border-box;margin:0;padding:0}
body{-webkit-text-size-adjust:100%;font-family:-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--txt);font-size:17px}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:16px;padding:9px 12px;border:1.5px solid #cbd5e1;border-radius:8px;background:#fff}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue)}
/* ===== splash ===== */
#splash{position:fixed;inset:0;background:linear-gradient(135deg,#667eea,#764ba2);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;color:#fff;transition:opacity .3s}
#splash.done{opacity:0;pointer-events:none}
#splash .logo{font-size:48.5px;margin-bottom:12px}
#splash .spin{width:36px;height:36px;border:4px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin 0.8s linear infinite;margin-top:18px}
@keyframes spin{to{transform:rotate(360deg)}}
#splash .msg{margin-top:14px;font-size:16px;opacity:.85}
/* ===== nav ===== */
nav{background:var(--navy);color:#fff;padding:0 20px;display:flex;align-items:center;justify-content:space-between;height:52px;position:sticky;top:0;z-index:100}
nav .brand{font-weight:700;font-size:18.5px}
nav .tabs{display:flex;gap:8px}
nav .tabs button{background:transparent;color:#cbd5e1;border:none;padding:8px 14px;border-radius:8px;font-size:16px;font-weight:600}
nav .tabs button.on{background:var(--blue);color:#fff}
/* ===== 共用 ===== */
.page{display:none;max-width:1200px;margin:0 auto;padding:20px 16px}
.page.on{display:block}
.card{background:var(--card);border-radius:var(--r);padding:20px;box-shadow:0 2px 8px rgba(15,23,42,.06);margin-bottom:16px}
.btn{border:none;border-radius:8px;padding:10px 18px;font-size:16px;font-weight:600;transition:filter .15s}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-p{background:var(--blue);color:#fff}
.btn-g{background:var(--green);color:#fff}
.btn-o{background:#fff;color:var(--txt2);border:1.5px solid #cbd5e1}
.btn-r{background:#fee2e2;color:#991b1b}
.btn-a{background:#fef3c7;color:#92400e}
.btn-sm{padding:6px 12px;font-size:15px}
.tag{display:inline-block;padding:3px 10px;border-radius:6px;font-size:14px;font-weight:600}
.tag-g{background:#dcfce7;color:#15803d}.tag-a{background:#fef3c7;color:#92400e}.tag-r{background:#fee2e2;color:#991b1b}.tag-b{background:#dbeafe;color:#1e40af}
.muted{color:var(--txt3);font-size:15px}
/* ===== toast ===== */
#toast{position:fixed;top:64px;left:50%;transform:translateX(-50%);z-index:10001;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{padding:12px 22px;border-radius:10px;color:#fff;font-weight:600;font-size:16px;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:tin .25s ease-out}
@keyframes tin{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}
/* ===== modal ===== */
.mask{position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:10000;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:#fff;border-radius:14px;max-width:640px;width:100%;max-height:90vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal .mh{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:19.5px}
.modal .mb{padding:18px 20px}
.modal .mf{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end}
/* ===== patient hero + hub ===== */
.hero{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border-radius:var(--r);padding:34px 20px;text-align:center;margin-bottom:18px}
.hero h1{font-size:30px}.hero p{margin-top:8px;opacity:.9;font-size:16px}
#hub{display:grid;grid-template-columns:1fr 1fr;gap:18px;max-width:760px;margin:0 auto}
.hub-card{border:none;border-radius:16px;padding:34px 22px;text-align:center;color:#fff;transition:transform .18s,box-shadow .18s}
.hub-card:hover{transform:translateY(-4px);box-shadow:0 14px 34px rgba(0,0,0,.22)}
.hub-card .ic{font-size:64.5px}.hub-card h3{font-size:24px;margin:10px 0 6px}.hub-card p{font-size:15px;opacity:.9}
.hub-new{background:linear-gradient(135deg,#667eea,#764ba2)}
.hub-find{background:linear-gradient(135deg,#11998e,#38ef7d)}
@media(max-width:640px){#hub{grid-template-columns:1fr}}
/* ===== steps ===== */
.steps{display:flex;align-items:center;justify-content:center;gap:6px;margin:18px 0}
.step{width:34px;height:34px;border-radius:50%;background:#e2e8f0;color:var(--txt3);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px}
.step.on{background:var(--blue);color:#fff}.step.done{background:var(--green);color:#fff}
.sline{width:34px;height:3px;background:#e2e8f0;border-radius:2px}.sline.done{background:var(--green)}
/* ===== doctor / clinic grid ===== */
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px;margin-top:14px}
.dcard{background:#fff;border:2px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;transition:border-color .15s,transform .15s,box-shadow .15s}
.dcard:hover{border-color:var(--purple);transform:translateY(-3px);box-shadow:0 10px 24px rgba(109,40,217,.16)}
.dcard.sel{border-color:var(--purple);background:#f5f3ff}
.dcard .ph{width:100%;aspect-ratio:3/4;background:linear-gradient(135deg,#a78bfa,#7c3aed);display:flex;align-items:center;justify-content:center;font-size:60px;font-weight:700;color:#fff;position:relative;overflow:hidden}
.dcard .ph .pimg{position:absolute;left:0;right:0;top:-6.5%;height:106.5%;background-size:cover;background-position:center top}
.poster-wrap{position:relative;overflow:hidden;max-height:66vh;aspect-ratio:59/84;margin:0 auto;background:#f8fafc;cursor:zoom-in;width:100%}
.poster-wrap img{position:absolute;left:0;top:-6.5%;width:100%;height:106.5%;object-fit:cover}
.dcard .inf{padding:11px 13px}
.dcard .nm{font-weight:700;font-size:18px}.dcard .cl{font-size:13px;color:var(--txt3);margin-top:4px;line-height:1.55}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin-top:14px}
.ccard{background:#fff;border:2px solid var(--line);border-radius:10px;padding:14px;cursor:pointer;transition:border-color .15s}
.ccard:hover,.ccard.sel{border-color:var(--blue);background:#eff6ff}
.ccard h4{font-size:17px}.ccard .muted{margin-top:4px}
.vtoggle{display:flex;gap:8px;margin-bottom:4px}
.vtoggle button{flex:1;padding:10px;border-radius:9px;border:2px solid #cbd5e1;background:#fff;color:var(--txt2);font-weight:600}
.vtoggle button.on{background:var(--purple);border-color:var(--purple);color:#fff}
/* ===== 門診表 table ===== */
.sched-tbl{width:100%;border-collapse:collapse;font-size:14.5px;margin-top:10px}
.sched-tbl th,.sched-tbl td{border:1px solid #e7d9c4;padding:6px;text-align:center;vertical-align:top}
.sched-tbl th{background:#f3e8d8;color:#6b4c2a}
.sched-tbl td .si{margin:3px 0;padding:5px;border-radius:6px;background:#fdf9f1;cursor:pointer;transition:background .12s}
.sched-tbl td .si:hover{background:#f5e6cc}
.sched-tbl td .si b{display:block;font-size:14.5px;color:#4a3418}
.sched-tbl td .si span{font-size:12.5px;color:#8a6d43}
/* ===== calendar ===== */
.calwrap{display:grid;grid-template-columns:340px 1fr;gap:18px}
@media(max-width:760px){.calwrap{grid-template-columns:1fr}}
.cal{border:1px solid var(--line);border-radius:10px;padding:12px}
.cal .chead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-weight:700}
.cal .chead button{width:30px;height:30px;border-radius:6px;border:1px solid #cbd5e1;background:#f8fafc}
.cal .cg{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal .wd{text-align:center;font-size:14px;color:var(--txt3);padding:4px 0}
.cal .wd.we{color:#dc2626}
.cal .dc{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:8px;font-size:16px;color:#cbd5e1;position:relative}
.cal .dc.ok{background:#e8f5e9;color:#2e7d32;font-weight:700;cursor:pointer}
.cal .dc.ok:hover{background:#c8e6c9}
.cal .dc.ok.multi{background:#fef3c7;color:#92400e}
.cal .dc.ok small{font-size:10.5px;font-weight:400;line-height:1}
.cal .dc.today{box-shadow:0 0 0 2px var(--amber) inset}
.cal .dc.sel{background:var(--green)!important;color:#fff!important}
/* ===== time slots ===== */
.tsgrp h4{margin:12px 0 6px;font-size:16px;color:var(--txt2)}
.tslots{display:flex;flex-wrap:wrap;gap:7px}
.ts{padding:9px 13px;border:2px solid #86efac;background:#f0fdf4;color:#15803d;border-radius:8px;cursor:pointer;font-weight:700;font-size:16px;text-align:center;transition:background .1s}
.ts:hover{background:#bbf7d0}
.ts.full{background:#4b5563;color:#e5e7eb;border-color:#374151;cursor:not-allowed;text-decoration:line-through;opacity:.8}
.ts.sel{background:var(--green);color:#fff;border-color:#15803d}
.ts small{display:block;font-size:12.5px;font-weight:400}
/* ===== form ===== */
.frow{margin-bottom:14px}
.frow label{display:block;font-size:15px;font-weight:600;margin-bottom:6px;color:var(--txt2)}
.frow input,.frow select,.frow textarea{width:100%}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:640px){.fgrid{grid-template-columns:1fr}}
.vt{display:flex;gap:10px}
.vt button{flex:1;padding:12px;border-radius:10px;border:2px solid #cbd5e1;background:#fff;font-weight:700}
.vt button.on{border-color:var(--blue);background:#eff6ff;color:var(--blue)}
.chk{display:flex;align-items:flex-start;gap:8px;padding:10px;border:1.5px solid var(--line);border-radius:8px;margin-bottom:8px;cursor:pointer;font-size:15.5px}
.chk input{width:auto;margin-top:2px}
/* ===== appt card (lookup) ===== */
.acard{background:#f8fafc;border:2px solid var(--line);border-radius:12px;padding:14px 16px;margin:10px 0;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
.acard .ad{font-size:18.5px;font-weight:700}.acard .am{font-size:15px;color:var(--txt2);margin-top:3px}
/* ===== counter ===== */
.cwrap{display:grid;grid-template-columns:210px 1fr;gap:16px}
@media(max-width:860px){.cwrap{grid-template-columns:1fr}}
.side{background:#fff;border-radius:var(--r);padding:14px;height:fit-content}
.side .who{font-size:15px;color:var(--txt3)}.side .whon{font-weight:700;font-size:17px;margin:2px 0 10px}
.side .mi{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:8px;font-size:16px;color:var(--txt2);cursor:pointer;margin-bottom:2px}
.side .mi:hover{background:#f1f5f9}.side .mi.on{background:#dbeafe;color:#1e40af;font-weight:700}
.login-card{max-width:360px;margin:60px auto;text-align:center}
.login-card input{width:100%;margin-bottom:10px;text-align:center}
/* counter grid */
.dnav{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.grid-tbl{width:100%;border-collapse:collapse;font-size:14px}
.grid-tbl th{background:#f8fafc;border:1px solid var(--line);padding:8px 6px;position:sticky;top:52px}
.grid-tbl th .gd{font-weight:700;font-size:15px}.grid-tbl th .gs{font-weight:400;color:var(--txt3);font-size:12.5px}
.grid-tbl td{border:1px solid var(--line);padding:2px;vertical-align:top;height:34px}
.grid-tbl td.off{background:repeating-linear-gradient(45deg,#f8fafc,#f8fafc 6px,#f1f5f9 6px,#f1f5f9 12px)}
.grid-tbl .tm{width:52px;text-align:center;color:var(--txt3);font-size:12.5px;background:#f8fafc}
.apt{border-radius:6px;padding:3px 6px;font-size:13px;font-weight:600;cursor:pointer;margin:1px 0;color:#fff;background:var(--blue)}
.apt.i{background:#7c3aed}.apt.done{background:var(--green)}.apt.re{background:var(--amber)}.apt.x{background:#9ca3af;text-decoration:line-through}
.orph{background:#fffbeb;border:2px solid #fcd34d;border-radius:10px;padding:12px 14px;margin-bottom:12px}
/* admin */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-bottom:16px}
.stat{background:#fff;border-radius:10px;padding:16px;border:1px solid var(--line)}
.stat .sv{font-size:30px;font-weight:800;color:var(--blue)}.stat .sl{font-size:14.5px;color:var(--txt3);margin-top:4px}
.tbl{width:100%;border-collapse:collapse;font-size:15px}
.tbl th{background:#f8fafc;text-align:left;padding:9px 10px;border-bottom:2px solid var(--line);font-size:14.5px;color:var(--txt2)}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--line)}
.tbl tr:hover td{background:#f8fafc}
.syncbar{background:#eff6ff;border:2px solid #93c5fd;border-radius:10px;padding:12px 16px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
/* 醫師排序拖曳列表 */
.ord-list{max-width:560px}
.ord-item{display:flex;align-items:center;gap:12px;background:#fff;border:2px solid var(--line);border-radius:10px;padding:9px 14px;margin-bottom:7px;cursor:grab;user-select:none;transition:border-color .12s,box-shadow .12s}
.ord-item:active{cursor:grabbing}
.ord-item.dragging{opacity:.45;border-style:dashed}
.ord-item.dragover{border-color:var(--blue);box-shadow:0 0 0 3px #dbeafe}
.ord-item .oi{width:30px;height:30px;border-radius:8px;background:#eff6ff;color:#1e40af;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;flex-shrink:0}
.ord-item .on2{font-weight:700;flex:1}
.ord-item .on2 small{display:block;color:var(--txt3);font-weight:400;font-size:12.5px}
.ord-item .ob{display:flex;gap:4px}
.ord-item .ob button{width:34px;height:30px;border:1px solid #cbd5e1;background:#f8fafc;border-radius:6px;font-size:14px}
.ord-item.vip{border-color:#fcd34d;background:#fffdf5}
/* 日期 pill + 迷你月曆 */
.dpill{display:inline-flex;align-items:center;gap:8px;padding:8px 16px;border:1.5px solid #cbd5e1;border-radius:22px;background:#fff;font-weight:700;cursor:pointer;font-size:16px;color:var(--txt)}
.dpill:hover{border-color:var(--blue);color:var(--blue)}
.dpill .pe{color:var(--txt3);font-size:15px}
/* 週檢視 */
.cweek{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;overflow-x:auto}
.cwd{border:1px solid var(--line);border-radius:10px;min-height:140px;background:#fff;min-width:120px}
.cwd .cwh{padding:7px 4px;border-bottom:1px solid var(--line);text-align:center;font-weight:700;font-size:15px;background:#f8fafc;border-radius:10px 10px 0 0}
.cwd .cwh small{display:block;color:var(--txt3);font-weight:400;font-size:12.5px}
.cwd.today .cwh{background:#dbeafe;color:#1e40af}
.cwd .cwb{padding:6px;display:flex;flex-direction:column;gap:4px}
.cwa{font-size:13px;padding:4px 7px;border-radius:6px;background:#eff6ff;border-left:3px solid var(--blue);cursor:pointer;line-height:1.4}
.cwa:hover{filter:brightness(.96)}
.cwa.i{border-left-color:#7c3aed;background:#f5f3ff}
.cwa.done{border-left-color:var(--green);background:#f0fdf4}
.cwa.re{border-left-color:var(--amber);background:#fffbeb}
.cwa small{color:var(--txt3)}
</style>
</head>
<body>
<div id="splash"><div class="logo">🏥</div><div style="font-size:23px;font-weight:700">金鶯減重診所</div><div class="spin"></div><div class="msg" id="splash-msg">載入最新班表中…</div></div>
<nav>
  <div class="brand">🏥 金鶯減重診所｜預約系統</div>
  <div class="tabs">
    <button data-act="portal" data-p="patient" class="on">🧑 減重預約</button>
    <button data-act="portal" data-p="counter">💼 櫃台管理</button>
    <button data-act="portal" data-p="admin">⚙️ 系統管理</button>
  </div>
</nav>
<div id="toast"></div>
<div id="modals"></div>

<!-- ═══════════ 病人端 ═══════════ -->
<div id="page-patient" class="page on">
  <div class="hero"><h1>線上預約就診</h1><p>3 分鐘完成預約 · 自動通知提醒 · 免排隊候診</p></div>
  <!-- Hub -->
  <div id="hub">
    <button class="hub-card hub-new" data-act="hub-new"><div class="ic">🆕</div><h3>我要預約</h3><p>選擇醫師、院區、時段<br>完成新的預約</p></button>
    <button class="hub-card hub-find" data-act="hub-find"><div class="ic">🔍</div><h3>查詢預約</h3><p>查看現有預約<br>改約或取消</p></button>
  </div>
  <!-- 預約流程 -->
  <div id="bkflow" style="display:none">
    <div class="steps" id="steps"></div>
    <div class="card" id="stepbox"></div>
  </div>
  <!-- 查詢預約 -->
  <div id="lookup" style="display:none">
    <div class="card" style="max-width:760px;margin:0 auto">
      <button class="btn btn-o btn-sm" data-act="hub-back">← 返回</button>
      <h2 style="margin:12px 0 6px">🔍 查詢預約</h2>
      <p class="muted">輸入下列任一欄位即可查詢（可只填一項）</p>
      <div class="fgrid" style="grid-template-columns:1fr 1fr 1fr;margin:14px 0">
        <input id="lk-name" placeholder="姓名（可填）">
        <input id="lk-phone" type="tel" placeholder="電話（可填）">
        <input id="lk-id" placeholder="身分證字號（可填）">
      </div>
      <button class="btn btn-g" style="width:100%;padding:12px" data-act="lk-go">查詢</button>
      <div id="lk-result" style="margin-top:18px"></div>
    </div>
  </div>
</div>

<!-- ═══════════ 櫃台端 ═══════════ -->
<div id="page-counter" class="page">
  <div id="c-login" class="card login-card">
    <div style="font-size:46px">💼</div><h2 style="margin:8px 0 4px">櫃台管理登入</h2>
    <p class="muted" style="margin-bottom:14px">請輸入員工編號與密碼</p>
    <input id="cl-id" placeholder="員工編號" autocomplete="off">
    <input id="cl-pw" type="password" placeholder="密碼">
    <div id="cl-err" style="color:var(--red);font-size:15px;min-height:18px;margin-bottom:6px"></div>
    <button class="btn btn-p" style="width:100%" data-act="c-login">登入</button>
  </div>
  <div id="c-main" class="cwrap" style="display:none">
    <div class="side">
      <div class="who">當前登入</div><div class="whon" id="c-who">—</div>
      <button class="btn btn-o btn-sm" data-act="c-logout" style="margin-bottom:12px">登出</button>
      <div class="mi on" data-act="c-menu" data-v="day">📅 今日看診表</div>
      <div class="mi" data-act="c-menu" data-v="call">📞 明日通知</div>
      <div class="mi" data-act="c-menu" data-v="quick">📞 電話預約登錄</div>
      <div class="mi" data-act="c-menu" data-v="find">🔎 病人查詢</div>
      <div class="mi" data-act="c-menu" data-v="notify">📨 通知紀錄</div>
      <div class="mi" data-act="c-menu" data-v="report">📊 當日報表</div>
    </div>
    <div id="c-content"></div>
  </div>
</div>

<!-- ═══════════ 系統管理 ═══════════ -->
<div id="page-admin" class="page">
  <div id="a-login" class="card login-card">
    <div style="font-size:46px">⚙️</div><h2 style="margin:8px 0 4px">系統管理登入</h2>
    <p class="muted" style="margin-bottom:14px">限系統管理員</p>
    <input id="al-id" placeholder="員工編號" autocomplete="off">
    <input id="al-pw" type="password" placeholder="密碼">
    <div id="al-err" style="color:var(--red);font-size:15px;min-height:18px;margin-bottom:6px"></div>
    <button class="btn btn-p" style="width:100%" data-act="a-login">登入</button>
  </div>
  <div id="a-main" class="cwrap" style="display:none">
    <div class="side">
      <div class="who">系統管理</div><div class="whon" id="a-who">—</div>
      <button class="btn btn-o btn-sm" data-act="a-logout" style="margin-bottom:12px">登出</button>
      <div class="mi on" data-act="a-menu" data-v="dash">📈 營運儀表板</div>
      <div class="mi" data-act="a-menu" data-v="sched">📅 班表管理</div>
      <div class="mi" data-act="a-menu" data-v="timecfg">⏱ 預約時間設定</div>
      <div class="mi" data-act="a-menu" data-v="order">↕ 前台醫師排序</div>
      <div class="mi" data-act="a-menu" data-v="emp">👥 使用者權限</div>
      <div class="mi" data-act="a-menu" data-v="report">📊 區間報表</div>
    </div>
    <div id="a-content"></div>
  </div>
</div>
<script>
/* ════════════════════════════════════════════════════════════════
 * 金鶯減重 v10 — 原生高效能版
 * 架構：開機先載入後端班表 → 一次渲染正確畫面（零閃爍）
 * 資料流：Drive → 後端(每日03:00 sync) → getSchedules API → 前端
 * ════════════════════════════════════════════════════════════════ */
'use strict';

/* ───── 設定 ───── */
const CFG = {
  GAS_URL: 'https://script.google.com/macros/s/AKfycbzdTS8wcbpKNpXokQB2KnXqbht-ZJIm1t4adIsyW9gUE0P_7SvvCcP3REJYbohFxfMBag/exec',
  TOKEN: 'kw_jingying_R9x2mQ7kL4nP8vH3aB6cD1eF5g',
  LIFF_ID: '',
  CACHE_TTL: 10 * 60 * 1000,   // 班表快取 10 分鐘
};
const CLINICS = [
  {code:'A',name:'鶯歌院區',area:'新北'},{code:'B',name:'三樹院區',area:'新北'},
  {code:'C',name:'樹林院區',area:'新北'},{code:'D',name:'桃園院區',area:'桃園'},
  {code:'E',name:'土城院區',area:'新北'},{code:'F',name:'八德院區',area:'桃園'},
  {code:'G',name:'龍潭院區',area:'桃園'},{code:'H',name:'大溪院區',area:'桃園'},
  {code:'I',name:'大竹院區',area:'桃園'},{code:'J',name:'大湳院區',area:'桃園'},
  {code:'K',name:'平鎮院區',area:'桃園'},{code:'L',name:'埔心院區',area:'桃園'},
  {code:'N',name:'觀音院區',area:'桃園'},{code:'Z',name:'虎尾幼安',area:'雲林'}
];
const WDS = ['日','一','二','三','四','五','六'];

/* ───── API 層 ───── */
const api = {
  async post(action, payload, withToken) {
    const body = { action, payload: payload || {} };
    if (withToken) body.token = CFG.TOKEN;
    try {
      const r = await fetch(CFG.GAS_URL, { method:'POST', headers:{'Content-Type':'text/plain'}, body: JSON.stringify(body) });
      return await r.json();
    } catch (e) { return { ok:false, error:String(e) }; }
  },
  async get(action, params) {
    const q = new URLSearchParams({ action, ...(params||{}) });
    try {
      const r = await fetch(CFG.GAS_URL + '?' + q);
      return await r.json();
    } catch (e) { return { ok:false, error:String(e) }; }
  }
};

/* ───── 全域 Store（單一資料源）───── */
const S = {
  schedules: [],          // 後端班表（唯一真實來源）
  loadedAt: 0,
  doctors: [],            // 由班表推導 + getDoctors 補充
  photos: {},             // shortName → dataURL
  apptCache: new Map(),   // 'clinic|date' → appointments[]
  timeCfg: { defaults:{initMin:30, followMin:15}, overrides:{} },  // 預約時長規則
  docOrder: [],           // 前台醫師顯示順序（後端儲存）
  docTitles: {},          // 醫師職稱（後端儲存，可後台編輯）
  ordDraft: null,         // 排序編輯草稿
  ordTitlesDraft: null,   // 職稱編輯草稿
  // 預約流程狀態
  bk: null,               // 見 resetBk()
  lookupResults: [],
  // 櫃台
  cUser: null, cView:'day', cMode:'day', cDate: null, cClinic: null, cSession:'all',
  // 管理
  aUser: null, aView:'dash',
};
function resetBk() {
  S.bk = { step:1, view:'doctor', doctor:null, clinic:null, anyDoc:false,
           date:null, weekday:null, slot:null, slotDoctor:null,
           calY:null, calM:null, type:'followup',
           name:'', phone:'', idNo:'', notify:'sms', items:[], remember:false,
           blood:{ mode:'date', date:null } };
}
resetBk();

/* ───── 工具 ───── */
const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad2 = n => String(n).padStart(2,'0');
const fmtD = d => `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
const t2m = t => { const m = String(t||'').match(/(\d{1,2}):(\d{2})/); return m ? +m[1]*60 + +m[2] : NaN; };
const m2t = m => `${pad2(Math.floor(m/60))}:${pad2(m%60)}`;
const normDoc = s => String(s||'').replace(/\s+/g,'').replace(/醫師/g,'').replace(/\(.*?\)/g,'').trim();
const isoWd = ds => { const d = new Date(ds+'T00:00'); const w = d.getDay(); return w===0?7:w; };
function toast(msg, color) {
  const t = document.createElement('div');
  t.className = 'toast'; t.style.background = color || 'var(--green)';
  t.textContent = msg;
  $('#toast').appendChild(t);
  setTimeout(() => t.remove(), 3200);
}
function modal(html) {
  const m = document.createElement('div');
  m.className = 'mask'; m.innerHTML = `<div class="modal">${html}</div>`;
  m.addEventListener('click', e => { if (e.target === m) m.remove(); });
  $('#modals').appendChild(m);
  return m;
}
function closeModals() { $('#modals').innerHTML = ''; }

/* ───── 照片解析度：依場景取適當大小（卡片 1000 / modal 2000 / 原圖 2400）───── */
const thumb = (u, w) => String(u || '').replace(/sz=w\d+/, 'sz=w' + w);

/* ───── 預約時長規則 ───── */
function cfgFor(doc) {
  return S.timeCfg.overrides[normDoc(doc)] || S.timeCfg.defaults;
}
const durFor = (type, doc) => type === 'initial' ? cfgFor(doc).initMin : cfgFor(doc).followMin;
function apptEndMin(a, docN) {
  const eT = a.endTime || a.end || a['結束時段'] || '';
  const em = t2m(fmtT(eT));
  const st = t2m(apptTime(a));
  if (!isNaN(em) && em > st) return em;
  const type = String(a.type || a['類型'] || '') === '初診' ? 'initial' : 'followup';
  return st + durFor(type, docN);
}
async function loadTimeCfg() {
  const res = await api.get('getTimeSettings');
  if (res.ok) S.timeCfg = { defaults: res.defaults || {initMin:30, followMin:15}, overrides: res.overrides || {} };
}
async function loadDocOrder() {
  const res = await api.get('getDoctorOrder');
  if (res.ok && Array.isArray(res.order)) S.docOrder = res.order;
  if (res.ok && res.titles) S.docTitles = res.titles;
}
/* 預設排序：三位總院長優先 → 其餘依院區順序分組 */
const CLINIC_ORDER = ['鶯歌院區','三樹院區','樹林院區','桃園院區','土城院區','八德院區','龍潭院區','大溪院區','大竹院區','大湳院區','平鎮院區','埔心院區','觀音院區','龍岡院區','虎尾幼安'];
const VIP_DOCTORS = ['蕭捷健','蕭捷存','黃錦崧'];
/* 內建預設職稱（後台「前台醫師排序」頁可改，改完存後端為準） */
const TITLE_OPTIONS = ['無', '醫學會理事長', '總院長', '院長'];
const DEFAULT_TITLES = {
  '蕭捷健':'醫學會理事長', '蕭捷存':'總院長', '黃錦崧':'總院長',
  '林永昌':'院長','張慧馨':'院長','林秉承':'院長','蕭宇伯':'院長','張簡千郁':'院長',
  '黃炯達':'院長','廖崑竹':'院長','何冠達':'院長','林鼎盛':'院長','陳秉峰':'院長','梁培毅':'院長'
};
function effTitle(n) {
  if (n in S.docTitles) return S.docTitles[n];      // 後端有設定 → 以後端為準
  return DEFAULT_TITLES[n] || '';
}
const TITLE_RANK = { '醫學會理事長': 0, '總院長': 1, '院長': 2, '': 3 };
function titleTag(n, size) {
  const t = effTitle(n);
  if (!t) return '';
  const cls = t === '院長' ? 'tag-b' : 'tag-a';
  return ` <span class="tag ${cls}" style="font-size:${size || 12}px">${t}</span>`;
}
function defaultDoctorOrder() {
  const names = S.doctors.map(d => d.shortName);
  const pos = n => {
    let best = 99;
    sched.clinicsFor(n).forEach(c => { const i = CLINIC_ORDER.indexOf(c); if (i >= 0 && i < best) best = i; });
    return best;
  };
  const vipIdx = n => { const i = VIP_DOCTORS.indexOf(n); return i < 0 ? 9 : i; };
  // 四層：理事長 → 總院長 → 各院區院長(依院區序) → 其餘醫師(依院區序)
  return [...names].sort((a, b) =>
    (TITLE_RANK[effTitle(a)] ?? 3) - (TITLE_RANK[effTitle(b)] ?? 3)
    || vipIdx(a) - vipIdx(b)
    || pos(a) - pos(b)
    || a.localeCompare(b, 'zh-Hant'));
}
function applyDoctorOrder() {
  const order = (S.docOrder && S.docOrder.length) ? S.docOrder : defaultDoctorOrder();
  const idx = n => { const i = order.indexOf(n); return i < 0 ? 999 : i; };
  S.doctors.sort((a, b) => idx(a.shortName) - idx(b.shortName) || a.shortName.localeCompare(b.shortName, 'zh-Hant'));
}

/* ───── 初診抽血窗口：看診日 T-6（最早）～ T-3（最晚），同院區 ───── */
function bloodWindowDates(visitDate, clinic) {
  const v = new Date(visitDate + 'T00:00');
  const today = new Date(); today.setHours(0,0,0,0);
  const okWds = clinic ? sched.clinicWeekdays(clinic) : null;
  const dates = [];
  for (let off = -6; off <= -3; off++) {
    const d = new Date(v); d.setDate(d.getDate() + off);
    if (d < today) continue;                                    // 已過期不可選
    const wd = d.getDay() === 0 ? 7 : d.getDay();
    if (okWds && okWds.size && !okWds.has(wd)) continue;        // 該日院區沒開診
    dates.push(fmtD(d));
  }
  return dates;
}
function bloodNote(b) {
  if (b.type !== 'initial') return '';
  const bl = b.blood || {};
  if (bl.mode === 'external') return '🩸外院報告(14天內,初診日攜帶)';
  if (bl.mode === 'sameday' || !bl.date) return '🩸初診當日抽血';
  return '🩸抽血日:' + bl.date;
}
const mdTxt = ds => `${+ds.slice(5,7)}/${+ds.slice(8,10)}（週${WDS[new Date(ds+'T00:00').getDay()]}）`;

/* ───── 班表查詢（全部走 Store，O(n) 單次掃描）───── */
const sched = {
  all: () => S.schedules,
  byDoctor: d => { const n = normDoc(d); return S.schedules.filter(s => normDoc(s.doctor) === n); },
  byClinic: c => S.schedules.filter(s => s.clinic === c),
  slotsFor: (d, c, wd) => { const n = normDoc(d); return S.schedules.filter(s => normDoc(s.doctor)===n && s.clinic===c && s.weekday===wd); },
  weekdaysFor: (d, c) => new Set(sched.slotsFor0(d, c).map(s => s.weekday)),
  slotsFor0: (d, c) => { const n = normDoc(d); return S.schedules.filter(s => normDoc(s.doctor)===n && s.clinic===c); },
  clinicWeekdays: c => new Set(S.schedules.filter(s => s.clinic===c).map(s => s.weekday)),
  clinicsFor: d => { const n = normDoc(d); return [...new Set(S.schedules.filter(s => normDoc(s.doctor)===n).map(s => s.clinic))]; },
  doctorNames: () => [...new Set(S.schedules.map(s => normDoc(s.doctor)))].filter(Boolean),
};

/* ───── 開機：先載入最新班表 ───── */
async function loadSchedules(force) {
  // sessionStorage 快取（10 分鐘）
  if (!force) {
    try {
      const c = JSON.parse(sessionStorage.getItem('kw10_sched') || 'null');
      if (c && Date.now() - c.at < CFG.CACHE_TTL && c.data.length > 0) {
        S.schedules = dietOnly(c.data); S.loadedAt = c.at;
        refreshSchedulesInBg();          // 背景靜默更新
        return true;
      }
    } catch(_){}
  }
  const res = await api.get('getSchedules');
  if (res.ok && Array.isArray(res.data) && res.data.length > 0) {
    S.schedules = dietOnly(res.data.map(normSched).filter(Boolean));
    S.loadedAt = Date.now();
    try { sessionStorage.setItem('kw10_sched', JSON.stringify({ at:S.loadedAt, data:S.schedules })); } catch(_){}
    return true;
  }
  return false;
}
function fmtT(v) {
  const s = String(v == null ? '' : v).trim();
  let m = s.match(/T(\d{2}):(\d{2}):\d{2}(?:\.\d+)?Z/);   // Sheets Date → UTC ISO，+8 轉台北
  if (m) return pad2((+m[1] + 8) % 24) + ':' + m[2];
  m = s.match(/(\d{1,2}):(\d{2})/);
  if (m) return pad2(+m[1]) + ':' + m[2];
  return s;
}
function cleanNote(n) {
  const s = String(n || '').trim();
  return /由Drive|自動同步|批次|匯入/.test(s) ? '' : s;   // 內部註記不對外顯示
}
function normSched(s) {
  if (!s || !s.clinic || !s.doctor) return null;
  let wd = Number(s.weekday); if (wd === 0) wd = 7;
  if (!(wd >= 1 && wd <= 7)) return null;
  const start = fmtT(s.start), end = fmtT(s.end);
  if (isNaN(t2m(start)) || isNaN(t2m(end))) return null;
  return { id:s.id||'', clinic:String(s.clinic).trim(), doctor:normDoc(s.doctor), weekday:wd,
           session:s.session||'', start, end, note:cleanNote(s.note), enabled:s.enabled!==false };
}
function dietOnly(arr) {
  // 預約系統只顯示「減重專診」班表；若後端只有減重資料則原樣返回
  const diet = arr.filter(s => s.session === '減重專診' || /減重/.test(s.note));
  return diet.length ? diet : arr;
}
function refreshSchedulesInBg() {
  api.get('getSchedules').then(res => {
    if (res.ok && Array.isArray(res.data) && res.data.length > 0) {
      S.schedules = dietOnly(res.data.map(normSched).filter(Boolean));
      S.loadedAt = Date.now();
      try { sessionStorage.setItem('kw10_sched', JSON.stringify({ at:S.loadedAt, data:S.schedules })); } catch(_){}
    }
  });
}
function buildDoctors() {
  // 由班表推導醫師清單（後端為準），照片另外補
  const names = sched.doctorNames();
  S.doctors = names.map(n => ({ shortName:n, name:n+' 醫師', clinics:sched.clinicsFor(n) }));
  applyDoctorOrder();
}
function loadPhotosInBg() {
  api.get('getDoctorPhotos').then(res => {
    if (res.ok && Array.isArray(res.data)) {
      res.data.forEach(p => {
        const k = normDoc(p['醫師姓名'] || p.doctor || '');
        const u = p['照片資料URL'] || p.url || '';
        if (k && u) S.photos[k] = u;
      });
      if (S.bk.step === 1 && $('#page-patient').classList.contains('on')) renderStep();
    }
  });
}

/* ───── 預約快取 ───── */
async function getAppts(clinic, date) {
  const k = clinic + '|' + date;
  if (S.apptCache.has(k)) return S.apptCache.get(k);
  const res = await api.get('getAppointmentsByClinicDate', { clinic, date });
  const list = (res.ok && Array.isArray(res.data)) ? res.data : [];
  S.apptCache.set(k, list);
  return list;
}
function apptTime(a) {
  if (typeof a.startMin === 'number') return m2t(a.startMin);
  const t = a.time || a.start || a.startTime || a['開始時段'] || '';
  const m = String(t).match(/(\d{1,2}):(\d{2})/);
  return m ? `${pad2(+m[1])}:${m[2]}` : '';
}

/* ───── 開機序列 ───── */
async function boot() {
  const [ok] = await Promise.all([loadSchedules(false), loadTimeCfg(), loadDocOrder()]);
  buildDoctors();
  $('#splash-msg').textContent = ok ? `已載入 ${S.schedules.length} 筆班表` : '⚠️ 後端無班表資料';
  if (!ok) toast('⚠️ 無法載入班表，請稍後重試或聯絡管理員', 'var(--red)');
  loadPhotosInBg();
  renderPatient();
  requestAnimationFrame(() => $('#splash').classList.add('done'));
  if (CFG.LIFF_ID && window.liff) { try { await liff.init({ liffId: CFG.LIFF_ID }); } catch(_){} }
}
</script>
<script>
/* ════════════════ 病人端 ════════════════ */
function renderPatient() {
  const inFlow = $('#bkflow').style.display !== 'none';
  if (inFlow) renderStep();
}
function showHub() {
  $('#hub').style.display = 'grid'; $('#bkflow').style.display = 'none'; $('#lookup').style.display = 'none';
  resetBk();
}
function showFlow() {
  $('#hub').style.display = 'none'; $('#bkflow').style.display = 'block'; $('#lookup').style.display = 'none';
  renderStep();
}
function showLookup() {
  $('#hub').style.display = 'none'; $('#bkflow').style.display = 'none'; $('#lookup').style.display = 'block';
  $('#lk-result').innerHTML = '';
}

/* ── 步驟條 ── */
function renderSteps() {
  let h = '';
  for (let i = 1; i <= 5; i++) {
    const cls = i < S.bk.step ? 'done' : i === S.bk.step ? 'on' : '';
    h += `<div class="step ${cls}">${i}</div>`;
    if (i < 5) h += `<div class="sline ${i < S.bk.step ? 'done' : ''}"></div>`;
  }
  $('#steps').innerHTML = h;
}

/* ── 主渲染 ── */
function renderStep() {
  renderSteps();
  const b = $('#stepbox');
  if (S.bk.step === 1) b.innerHTML = htmlStep1();
  else if (S.bk.step === 2) b.innerHTML = htmlStep2();
  else if (S.bk.step === 3) { b.innerHTML = htmlStep3(); loadStep3Slots(); }
  else if (S.bk.step === 4) b.innerHTML = htmlStep4();
  else if (S.bk.step === 5) b.innerHTML = htmlStep5();
}

/* ── Step 1：選醫師（醫師別 / 院區別）── */
function htmlStep1() {
  const v = S.bk.view;
  let inner;
  if (v === 'doctor') {
    inner = `<div class="dgrid">` + S.doctors.map(d => {
      const ph = S.photos[d.shortName];
      const av = ph ? `style="background-image:url('${esc(thumb(ph, 1000))}')"` : '';
      const sel = S.bk.doctor === d.shortName ? ' sel' : '';
      return `<div class="dcard${sel}" data-act="pick-doc" data-d="${esc(d.shortName)}">
        <div class="ph">${ph ? `<div class="pimg" ${av}></div>` : esc(d.shortName.charAt(0))}</div>
        <div class="inf"><div class="nm">${esc(d.shortName)} 醫師${titleTag(d.shortName, 12)}</div><div class="cl">${d.clinics.map(esc).join('・')}</div></div></div>`;
    }).join('') + `</div>`;
  } else if (S.bk.clinic && !S.bk.doctor) {
    // 院區已選 → 顯示該院區門診表
    inner = `<button class="btn btn-o btn-sm" data-act="clinic-back">← 返回院區選擇</button>
      <div style="margin:10px 0"><span class="tag tag-b">${esc(S.bk.clinic)}</span></div>
      <button class="btn btn-p" data-act="any-doc" style="margin-bottom:6px">🏥 不指定醫師 · 直接看全部可約時段</button>
      ${clinicWeekTable(S.bk.clinic)}
      <p class="muted" style="margin-top:8px">點門診表內的醫師時段可直接預約</p>`;
  } else {
    inner = `<div class="cgrid">` + CLINICS.map(c => {
      const n = new Set(sched.byClinic(c.name).map(s => normDoc(s.doctor))).size;
      return `<div class="ccard" data-act="pick-clinic" data-c="${esc(c.name)}">
        <h4>📍 ${esc(c.name)}</h4><div class="muted">${esc(c.area)} · ${n} 位醫師 →</div></div>`;
    }).join('') + `</div>`;
  }

/* 院區週門診表 */
function clinicWeekTable(clinic) {
  const rows = sched.byClinic(clinic);
  if (!rows.length) return `<p class="muted" style="padding:20px;text-align:center">此院區目前無班表資料</p>`;
  const sessions = [...new Set(rows.map(r => r.session || '門診'))];
  const order = { '早診':0,'午診':1,'晚診':2,'減重專診':3 };
  sessions.sort((a,b) => (order[a]??9) - (order[b]??9));
  let h = `<table class="sched-tbl"><thead><tr><th style="width:52px">時段</th>`;
  for (let w = 1; w <= 7; w++) h += `<th>週${WDS[w%7]}</th>`;
  h += `</tr></thead><tbody>`;
  sessions.forEach(sess => {
    h += `<tr><th>${esc(sess)}</th>`;
    for (let w = 1; w <= 7; w++) {
      const cell = rows.filter(r => (r.session||'門診') === sess && r.weekday === w)
                       .sort((a,b) => t2m(a.start) - t2m(b.start));
      h += `<td>` + cell.map(r =>
        `<div class="si" data-act="slot-doc" data-d="${esc(r.doctor)}" data-c="${esc(clinic)}" data-w="${r.weekday}">
          <b>${esc(r.doctor)} 醫師</b><span>${esc(r.start)}–${esc(r.end)}</span></div>`).join('') + `</td>`;
    }
    h += `</tr>`;
  });
  return h + `</tbody></table>`;
}

function calHtml() {
  const b = S.bk;
  const Y = b.calY, M = b.calM;
  const today = new Date(); today.setHours(0,0,0,0);
  const isCur = Y === today.getFullYear() && M === today.getMonth()+1;
  const okWds = b.anyDoc ? sched.clinicWeekdays(b.clinic) : sched.weekdaysFor(b.doctor, b.clinic);
  const docCount = {};
  if (b.anyDoc) { for (let w = 1; w <= 7; w++) docCount[w] = new Set(sched.byClinic(b.clinic).filter(s => s.weekday===w).map(s => s.doctor)).size; }
  let h = `<div class="chead"><button data-act="cal-nav" data-d="-1">‹</button><span>${Y} 年 ${M} 月</span><button data-act="cal-nav" data-d="1">›</button></div><div class="cg">`;
  ['日','一','二','三','四','五','六'].forEach((w,i) => h += `<div class="wd ${i===0||i===6?'we':''}">${w}</div>`);
  const off = new Date(Y, M-1, 1).getDay();
  for (let i = 0; i < off; i++) h += `<div></div>`;
  const days = new Date(Y, M, 0).getDate();
  for (let d = 1; d <= days; d++) {
    const ds = `${Y}-${pad2(M)}-${pad2(d)}`;
    const dt = new Date(Y, M-1, d);
    const wd = dt.getDay() === 0 ? 7 : dt.getDay();
    const past = dt < today;
    const can = !past && okWds.has(wd);
    const cls = ['dc', can?'ok':'', (isCur && d===today.getDate())?'today':'', b.date===ds?'sel':'', (can && b.anyDoc)?'multi':''].filter(Boolean).join(' ');
    const sub = (can && b.anyDoc) ? `<small>${docCount[wd]}醫師</small>` : '';
    h += `<div class="${cls}" ${can?`data-act="pick-date" data-ds="${ds}" data-w="${wd}"`:''}>${d}${sub}</div>`;
  }
  return h + `</div>`;
}
/* 時段渲染：依醫師時長規則切格，初診佔滿全長、與既有預約重疊即反黑 */
async function loadStep3Slots() {
  const b = S.bk;
  if (!b.date) return;
  const box = $('#ts-box');
  if (!box) return;
  box.innerHTML = `<p class="muted" style="padding:20px;text-align:center">載入時段中…</p>`;
  const rows = b.anyDoc
    ? sched.byClinic(b.clinic).filter(s => s.weekday === b.weekday)
    : sched.slotsFor(b.doctor, b.clinic, b.weekday);
  if (!rows.length) {
    box.innerHTML = `<div style="padding:20px;background:#fef2f2;border:2px solid #fecaca;border-radius:10px;text-align:center;color:var(--red);font-weight:600">本日無門診，請另選日期</div>`;
    return;
  }
  // 依各醫師設定切格：間隔=複診分鐘；本次預約時長=初診分鐘或複診分鐘
  const fine = [];
  rows.forEach(r => {
    const cfg = cfgFor(r.doctor);
    const dur = b.type === 'initial' ? cfg.initMin : cfg.followMin;
    const endM = t2m(r.end);
    for (let t = t2m(r.start); t + dur <= endM; t += cfg.followMin)
      fine.push({ m:t, t:m2t(t), doctor:r.doctor, dur });
  });
  fine.sort((a,b2) => a.m - b2.m);
  const appts = await getAppts(b.clinic, b.date);
  if (S.bk.date !== b.date) return;
  // 每位醫師的已佔用區間（初診佔 30 分就整段擋掉）
  const blocks = {};
  appts.forEach(a => {
    if (a.status === 'cancelled' || a['狀態'] === '已取消') return;
    const dn = normDoc(a.doctor || a['醫師'] || '');
    const st = t2m(apptTime(a));
    if (isNaN(st)) return;
    (blocks[dn] = blocks[dn] || []).push([st, apptEndMin(a, dn)]);
  });
  const overlaps = (dn, s, e) => (blocks[dn] || []).some(([bs, be]) => s < be && bs < e);
  const groups = { '早診':[], '午診':[], '晚診':[] };
  fine.forEach(f => {
    const hr = Math.floor(f.m / 60);
    groups[hr < 12 ? '早診' : hr < 18 ? '午診' : '晚診'].push(f);
  });
  let h = '';
  Object.entries(groups).forEach(([g, arr]) => {
    if (!arr.length) return;
    h += `<div class="tsgrp"><h4>${g}</h4><div class="tslots">`;
    arr.forEach(f => {
      const full = overlaps(normDoc(f.doctor), f.m, f.m + f.dur);
      const sel = b.slot === f.t && (!b.anyDoc || b.slotDoctor === f.doctor);
      const rangeTxt = `${f.t}<small>~${m2t(f.m + f.dur)}${b.anyDoc ? ' ' + esc(f.doctor) + ' 醫師' : ''}</small>`;
      h += full
        ? `<div class="ts full" title="此時段已被預約">${rangeTxt}</div>`
        : `<div class="ts ${sel ? 'sel' : ''}" data-act="pick-slot" data-t="${f.t}" data-d="${esc(f.doctor)}">${rangeTxt}</div>`;
    });
    h += `</div></div>`;
  });
  box.innerHTML = h || `<p class="muted">本日無可約時段</p>`;
}

/* ════════════════ 查詢 / 改約 / 取消 ════════════════ */
async function doLookup() {
  const name = $('#lk-name').value.trim(), phone = $('#lk-phone').value.trim(), idNo = $('#lk-id').value.trim();
  if (!name && !phone && !idNo) { toast('請至少填一項', 'var(--amber)'); return; }
  const out = $('#lk-result');
  out.innerHTML = `<p class="muted" style="text-align:center;padding:16px">查詢中…（搜尋雲端 + 各院區，約 5 秒）</p>`;
  const pN = phone.replace(/\D/g,''), nN = name.replace(/\s+/g,'').toLowerCase(), iN = idNo.toUpperCase().replace(/\s+/g,'');
  const match = a => {
    const ap = String(a.phone||a['電話']||'').replace(/\D/g,'');
    const an = String(a.name||a.patientName||a['病人姓名']||a['姓名']||'').replace(/\s+/g,'').toLowerCase();
    const ai = String(a.idNo||a.idCard||a['身分證']||'').toUpperCase().replace(/\s+/g,'');
    return (pN && ap === pN) || (nN && an === nN) || (iN && ai && ai === iN);
  };
  const tasks = [];
  [name, pN, iN].filter(Boolean).forEach(kw =>
    tasks.push(api.post('searchPatientHistory', { keyword: kw }, true).then(r => (r.ok && r.data) || [])));
  const today = new Date(); today.setHours(0,0,0,0);
  const dates = Array.from({length:21}, (_,i) => { const d = new Date(today); d.setDate(d.getDate()+i); return fmtD(d); });
  CLINICS.forEach(c => dates.forEach(ds =>
    tasks.push(getAppts(c.name, ds).then(list => list.filter(match).map(a => ({...a, clinic:c.name, date:ds}))))));
  const results = (await Promise.all(tasks)).flat().filter(match);
  const seen = new Set();
  const future = results.filter(a => {
    const t = apptTime(a);
    const k = `${a.date}|${t}|${normDoc(a.doctor||a['醫師'])}`;
    if (seen.has(k)) return false; seen.add(k);
    const d = new Date((a.date||'') + 'T00:00');
    if (isNaN(d) || d < today) return false;
    if (a.status === 'cancelled' || a['狀態'] === '已取消') return false;
    a._t = t; return true;
  }).sort((x,y) => (x.date+x._t).localeCompare(y.date+y._t));
  S.lookupResults = future;
  if (!future.length) {
    out.innerHTML = `<div style="text-align:center;padding:22px;background:#f8fafc;border-radius:10px">
      <p class="muted">😕 找不到符合的未來預約</p>
      <p class="muted" style="font-size:14px;margin-top:6px">已搜尋各院區未來 21 天。如已預約但查不到，請聯絡院區櫃台</p></div>`;
    return;
  }
  out.innerHTML = `<h3 style="margin-bottom:8px">您的預約（${future.length} 筆）</h3>` + future.map((a,i) => {
    const wd = WDS[new Date(a.date+'T00:00').getDay()];
    return `<div class="acard"><div>
      <div class="ad">${esc(a.date)}（週${wd}）${esc(a._t)}</div>
      <div class="am">${esc(a.name||a['病人姓名']||'')} · ${esc(normDoc(a.doctor||a['醫師']))} 醫師 · ${esc(a.clinic)} · ${esc(a.type||a['類型']||'複診')}</div></div>
      <div style="display:flex;gap:8px">
        <button class="btn btn-a btn-sm" data-act="resch" data-i="${i}">↔ 改約</button>
        <button class="btn btn-r btn-sm" data-act="cancel" data-i="${i}">✕ 取消</button></div></div>`;
  }).join('') + `<p class="muted" style="margin-top:12px">⚠️ 24 小時內的預約請聯絡院區櫃台處理</p>`;
}
function within24h(a) { return new Date(`${a.date}T${a._t||'00:00'}`) - new Date() < 24*3600*1000; }

async function loadCDayGrid() {
  const clinic = S.cClinic, date = S.cDate;
  const wd = isoWd(date);
  const dayScheds = sched.byClinic(clinic).filter(s => s.weekday === wd)
    .sort((a,b) => t2m(a.start) - t2m(b.start));
  const docs = [...new Set(dayScheds.map(s => s.doctor))];
  const box = $('#cd-grid');
  if (!box) return;
  if (!docs.length) { box.innerHTML = `<p class="muted">😴 ${clinic} 本日無排班</p>`; $('#cd-orph').innerHTML=''; return; }
  S.apptCache.delete(clinic + '|' + date);
  const appts = (await getAppts(clinic, date)).filter(a => a.status !== 'cancelled' && a['狀態'] !== '已取消');
  if (S.cClinic !== clinic || S.cDate !== date) return;
  // 網格範圍
  let minM = Math.min(...dayScheds.map(s => t2m(s.start))), maxM = Math.max(...dayScheds.map(s => t2m(s.end)));
  if (S.cSession !== 'all') {
    const rng = { '早診':[6*60,12*60], '午診':[12*60,18*60], '晚診':[18*60,22*60] }[S.cSession];
    minM = Math.max(minM, rng[0]); maxM = Math.min(maxM, rng[1]);
  }
  minM = Math.floor(minM/60)*60; maxM = Math.ceil(maxM/60)*60;
  // 格線間隔 = 當日醫師複診分鐘的最大公因數（例：15 與 10 混合 → 5 分鐘格）
  const gcd2 = (a2,b2) => b2 ? gcd2(b2, a2 % b2) : a2;
  const gridStep = docs.map(dn => cfgFor(dn).followMin).reduce((g, v) => gcd2(g, v), 60) || 15;
  const rowsPerHour = Math.round(60 / gridStep);
  const byDocT = {};
  appts.forEach(a => {
    const dn = normDoc(a.doctor || a['醫師'] || '');
    const t = apptTime(a); if (!t) return;
    (byDocT[dn+'|'+t] = byDocT[dn+'|'+t] || []).push(a);
  });
  const docRanges = {};
  docs.forEach(dn => { docRanges[dn] = dayScheds.filter(s => s.doctor === dn).map(s => [t2m(s.start), t2m(s.end)]); });
  let h = `<div style="overflow:auto"><table class="grid-tbl"><thead><tr><th class="tm">時間</th>`;
  docs.forEach(dn => {
    const rs = dayScheds.filter(s => s.doctor === dn).map(s => `${s.start}–${s.end}`).join('、');
    h += `<th><div class="gd">${esc(dn)} 醫師</div><div class="gs">${esc(rs)}</div></th>`;
  });
  h += `</tr></thead><tbody>`;
  for (let t = minM; t < maxM; t += gridStep) {
    const tt = m2t(t);
    h += `<tr>` + (t % 60 === 0 ? `<td class="tm" rowspan="${rowsPerHour}">${tt}</td>` : '') ;
    docs.forEach(dn => {
      const on = docRanges[dn].some(([s,e]) => t >= s && t < e);
      const cell = byDocT[dn+'|'+tt] || [];
      h += `<td class="${on?'':'off'}">` + cell.map(a => {
        const st = a.status || a['狀態'] || '';
        const cls = st==='checked_in'||st==='已報到' ? 'done' : st==='rescheduled'||st==='已改約' ? 're' : (a.type==='初診'||a['類型']==='初診') ? 'i' : '';
        return `<div class="apt ${cls}" data-act="appt-detail" data-k="${esc(dn)}|${tt}">${esc(a.name||a['病人姓名']||'(未填)')} · ${esc(a.type||a['類型']||'複診')}</div>`;
      }).join('') + `</td>`;
    });
    h += `</tr>`;
  }
  h += `</tbody></table></div>
    <div class="muted" style="margin-top:8px">■ 複診 <span style="color:#7c3aed">■ 初診</span> <span style="color:var(--green)">■ 已報到</span> <span style="color:var(--amber)">■ 已改約</span> · 共 ${appts.length} 筆預約</div>`;
  box.innerHTML = h;
  window.__cdApptIndex = byDocT;
  // 待補登
  const orph = appts.filter(a => {
    const dn = normDoc(a.doctor || a['醫師'] || '');
    if (!dn || dn === '系統指派') return true;
    if (!docs.includes(dn)) return true;
    const tM = t2m(apptTime(a));
    return !(docRanges[dn]||[]).some(([s,e]) => tM >= s && tM < e);
  });
  $('#cd-orph').innerHTML = !orph.length ? '' : `<div class="orph">
    <b style="color:#92400e">⚠️ 待補登／待指派預約（${orph.length} 筆）</b>
    <table class="tbl" style="margin-top:8px"><thead><tr><th>病人</th><th>電話</th><th>時段</th><th>類型</th><th>醫師</th><th>問題</th></tr></thead><tbody>`
    + orph.map(a => {
      const dn = normDoc(a.doctor||a['醫師']||'');
      const prob = (!dn || dn==='系統指派') ? '未指派醫師' : !docs.includes(dn) ? '醫師當日無班表' : '時段外';
      return `<tr><td>${esc(a.name||a['病人姓名']||'(未填)')}</td><td>${esc(a.phone||a['電話']||'')}</td>
        <td>${esc(apptTime(a))}</td><td>${esc(a.type||a['類型']||'')}</td><td>${esc(dn||'—')}</td>
        <td style="color:var(--red)">${prob}</td></tr>`;
    }).join('') + `</tbody></table></div>`;
}

async function cAction(m, action) {

    const res = await api.post('updateAppointmentStatus', { apptId:a.apptId, clinic:a.clinic, date:a.date,
      startTime:a.t, doctor:a.doctor, status:'checked_in', by:S.cUser.name, source:'counter' }, true);

  } else if (action === 'cancel') {
    const weeks = prompt('取消前是否拿藥？輸入週數（0 = 不拿藥）', '0');
    if (weeks === null) return;
    const res = await api.post('updateAppointmentStatus', { apptId:a.apptId, clinic:a.clinic, date:a.date,
      startTime:a.t, doctor:a.doctor, status:'cancelled', medicationWeeks:+weeks||'',

    if (res.ok) { toast('✓ 已取消'); closeModals(); S.apptCache.delete(a.clinic+'|'+a.date); renderCounter(); }
    else toast('取消失敗：'+(res.error||''), 'var(--red)');
  } else if (action === 'resch') {
    const nd = prompt('新日期（YYYY-MM-DD）', a.date); if (!nd) return;
    const nt = prompt('新時段（HH:MM）', a.t); if (!nt) return;
    const diffDays = Math.abs(Math.round((new Date(nd) - new Date(a.date)) / 86400000));
    const sugW = Math.max(1, Math.ceil(diffDays / 7));
    const weeks = prompt(`拿藥週數？（相距 ${diffDays} 天，建議 ${sugW} 週；0 = 不拿藥）`, String(sugW));
    if (weeks === null) return;
    const res = await api.post('rescheduleAppointment', { oldApptId:a.apptId, clinic:a.clinic,
      date:nd, startTime:nt, endTime:m2t(t2m(nt) + durFor(a.type==='初診'?'initial':'followup', a.doctor)), doctor:a.doctor, name:a.name, phone:a.phone,

      employeeName:S.cUser.name, source:'counter' }, true);
    if (res.ok) { toast('✓ 改約完成'); closeModals(); S.apptCache.clear(); renderCounter(); }
    else toast('改約失敗：'+(res.error||''), 'var(--red)');
  }
}

const TAG_BIN = '🩸院內報告OK', TAG_BEXT = '🩸外院報告(初診日帶來)', TAG_BNO = '🩸未抽血已提醒';
const BLOOD_CLEAR = /🩸院內報告OK|🩸外院報告\(初診日帶來\)|🩸外院報告|🩸報告OK|🩸未抽血已提醒/g;
function tagNote(note, addTag, clearRes) {
  let n = String(note || '');
  clearRes.forEach(r => { n = n.replace(r, ''); });
  n = n.replace(/\s{2,}/g, ' ').trim();
  return (n ? n + ' ' : '') + addTag;
}
async function apptSetNote(a, newNote) {
  const id = a.apptId || a.id || a['預約編號'] || '';
  if (!id) { toast('此筆缺預約編號，無法標記', 'var(--red)'); return false; }
  const res = await api.post('updateAppointmentFields', {
    apptId: id, fields: { '備註': newNote },
    employeeName: (S.cUser || {}).name || '', employeeRole: (S.cUser || {}).role || '', employeeId: (S.cUser || {}).employeeId || ''
  }, true);
  if (res.ok) { a.note = newNote; a['備註'] = newNote; S.apptCache.clear(); return true; }
  toast('更新失敗：' + (res.error || ''), 'var(--red)');
  return false;
}
async function markAppt(a, op) {
  const note = String(a.note || a['備註'] || '');
  const now = new Date();
  let newNote;
  if (op === 'notified') newNote = tagNote(note, `☎已通知${now.getMonth()+1}/${now.getDate()}`, [/☎已通知[0-9\/]*/g]);
  else if (op === 'bin') newNote = tagNote(note, TAG_BIN, [BLOOD_CLEAR]);
  else if (op === 'bext') newNote = tagNote(note, TAG_BEXT, [BLOOD_CLEAR]);
  else newNote = tagNote(note, TAG_BNO, [BLOOD_CLEAR]);
  const ok = await apptSetNote(a, newNote);
  if (ok) toast({ notified:'✓ 已標記通知', bin:'✓ 已確認院內抽血報告', bext:'✓ 已標記外院報告（初診日帶來）', bno:'✓ 已標記未抽血並提醒當日補抽' }[op]);
  return ok;
}

function htmlAOrder() {

    <div style="display:flex;gap:10px;margin-bottom:14px">
      <button class="btn btn-g" data-act="ord-save">💾 儲存排序</button>
      <button class="btn btn-o" data-act="ord-reset">↺ 回預設</button>
    </div>
    <div class="ord-list" id="ord-list">${rows}</div></div>`;
}
let _ordDragIdx = null;
function bindOrderDrag() {
  const list = $('#ord-list');
  if (!list) return;
  list.addEventListener('dragstart', e => {
    const it = e.target.closest('.ord-item'); if (!it) return;
    _ordDragIdx = +it.dataset.idx;
    it.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
  });
  list.addEventListener('dragend', e => {
    list.querySelectorAll('.ord-item').forEach(x => x.classList.remove('dragging', 'dragover'));
  });
  list.addEventListener('dragover', e => {
    e.preventDefault();
    const it = e.target.closest('.ord-item'); if (!it) return;
    list.querySelectorAll('.ord-item').forEach(x => x.classList.remove('dragover'));
    it.classList.add('dragover');
  });
  list.addEventListener('drop', e => {
    e.preventDefault();
    const it = e.target.closest('.ord-item'); if (!it || _ordDragIdx == null) return;
    const to = +it.dataset.idx;
    if (to !== _ordDragIdx) {
      const [moved] = S.ordDraft.splice(_ordDragIdx, 1);
      S.ordDraft.splice(to, 0, moved);
    }
    _ordDragIdx = null;
    renderAdmin();
  });
}

/* ════════════════ 全站事件委派（單一 handler）════════════════ */
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;
  const m = el.closest('.mask');
  switch (act) {
    /* nav */
    case 'portal': {
      document.querySelectorAll('nav .tabs button').forEach(b => b.classList.toggle('on', b === el));
      document.querySelectorAll('.page').forEach(p => p.classList.remove('on'));
      $('#page-' + el.dataset.p).classList.add('on');
      break; }
    /* hub */
    case 'hub-new': resetBk(); showFlow(); break;
    case 'hub-find': showLookup(); break;
    case 'hub-back': showHub(); break;
    /* step1 */
    case 'view-doc': S.bk.view = 'doctor'; renderStep(); break;
    case 'view-clinic': S.bk.view = 'clinic'; S.bk.clinic = null; S.bk.doctor = null; renderStep(); break;
    case 'pick-doc': openDoctorIntro(el.dataset.d); break;
    case 'book-doc': closeModals(); openDoctorSchedule(el.dataset.d); break;
    case 'pick-clinic': S.bk.clinic = el.dataset.c; S.bk.doctor = null; renderStep(); break;
    case 'clinic-back': S.bk.clinic = null; renderStep(); break;
    case 'ds-slot': case 'slot-doc': {
      closeModals();
      S.bk.doctor = el.dataset.d; S.bk.clinic = el.dataset.c; S.bk.anyDoc = false;
      S.bk.step = 3; S.bk.date = null; S.bk.slot = null;
      // 自動選最近的該 weekday 日期
      const wd = +el.dataset.w;
      const today = new Date(); today.setHours(0,0,0,0);
      const d = new Date(today);
      let diff = (wd - (d.getDay()===0?7:d.getDay()) + 7) % 7;
      if (diff === 0) diff = 7;
      d.setDate(d.getDate() + diff);
      S.bk.date = fmtD(d); S.bk.weekday = wd; S.bk.calY = d.getFullYear(); S.bk.calM = d.getMonth()+1;
      showFlow();
      toast(`已帶入 ${S.bk.doctor} 醫師 · ${S.bk.clinic}，請選時段`, 'var(--blue)');
      break; }
    case 'any-doc': {
      S.bk.anyDoc = true; S.bk.doctor = null; S.bk.step = 3; S.bk.date = null; S.bk.slot = null;
      S.bk.calY = null;
      renderStep();
      toast(`🏥 ${S.bk.clinic} 不指定醫師模式 — 請挑日期時段`, '#1e3a8a');
      break; }
    case 'next1':
      if (S.bk.view === 'doctor') {
        if (!S.bk.doctor) { toast('請先點選醫師卡片（會開啟介紹）', 'var(--amber)'); break; }
        S.bk.step = 2; renderStep();
      } else if (S.bk.clinic) { toast('請直接點門診表內的醫師時段，或按「不指定醫師」', 'var(--amber)'); }
      else toast('請先選擇院區', 'var(--amber)');
      break;
    /* step2 */
    case 'pick-clinic2': S.bk.clinic = el.dataset.c; renderStep(); break;
    case 'next2':
      if (!S.bk.clinic) { toast('請選擇院區', 'var(--amber)'); break; }
      S.bk.step = 3; S.bk.calY = null; S.bk.date = null; S.bk.slot = null; renderStep(); break;
    /* step3 */
    case 'cal-nav': {
      S.bk.calM += +el.dataset.d;
      if (S.bk.calM < 1) { S.bk.calM = 12; S.bk.calY--; }
      if (S.bk.calM > 12) { S.bk.calM = 1; S.bk.calY++; }
      renderStep(); break; }
    case 'pick-date':
      S.bk.date = el.dataset.ds; S.bk.weekday = +el.dataset.w; S.bk.slot = null;
      renderStep(); break;
    case 'pick-slot':
      S.bk.slot = el.dataset.t; S.bk.slotDoctor = el.dataset.d;
      document.querySelectorAll('.ts.sel').forEach(x => x.classList.remove('sel'));
      el.classList.add('sel');
      break;
    case 'next3':
      if (!S.bk.date) { toast('請選擇日期', 'var(--amber)'); break; }
      if (!S.bk.slot) { toast('請選擇時段', 'var(--amber)'); break; }
      // 帶入記住的資訊
      try { const me = JSON.parse(localStorage.getItem('kw10_me')||'null');
        if (me) { S.bk.name = S.bk.name || me.name || ''; S.bk.phone = S.bk.phone || me.phone || ''; S.bk.idNo = S.bk.idNo || me.idNo || ''; S.bk.remember = true; } } catch(_){}
      S.bk.step = 4; renderStep(); break;
    /* step4 */
    case 'vt': S.bk.type = el.dataset.v; S.bk.slot = null; S.bk.blood = { mode:'date', date:null }; renderStep(); break;
    case 'blood-mode': captureF4(); S.bk.blood.mode = el.dataset.v; renderStep(); break;
    case 'blood-date': captureF4(); S.bk.blood = { mode:'date', date: el.dataset.ds }; renderStep(); break;
    case 'nt': S.bk.notify = el.dataset.v; captureF4(); renderStep(); break;
    case 'next4': {
      captureF4();
      if (!S.bk.name) { toast('請填姓名', 'var(--amber)'); break; }
      if (!/^09\d{8}$/.test(S.bk.phone.replace(/\D/g,''))) { toast('請填正確手機號碼', 'var(--amber)'); break; }
      if (S.bk.type === 'initial' && S.bk.blood.mode === 'date' && !S.bk.blood.date) { toast('請選擇抽血日期（或改選外院報告）', 'var(--amber)'); break; }
      S.bk.step = 5; renderStep(); break; }
    /* step5 */
    case 'confirm-book': confirmBooking(); break;
    case 'back': S.bk.step = +el.dataset.s; renderStep(); break;
    /* lookup */
    case 'lk-go': doLookup(); break;
    case 'resch': { const a = S.lookupResults[+el.dataset.i]; if (within24h(a)) { toast('⚠️ 24 小時內請聯絡櫃台', 'var(--amber)'); break; } openResch(a); break; }
    case 'cancel': { const a = S.lookupResults[+el.dataset.i]; if (within24h(a)) { toast('⚠️ 24 小時內請聯絡櫃台', 'var(--amber)'); break; } openCancel(a); break; }
    case 'resch-calc': reschCalc(m); break;
    case 'resch-go': reschGo(m, el); break;
    case 'cx-meds': {
      m.dataset.meds = el.dataset.v;
      m.querySelector('#cx-wk').style.display = el.dataset.v === 'yes' ? 'inline' : 'none';
      const go = m.querySelector('#cx-go'); go.disabled = false; go.style.opacity = '1';
      m.querySelectorAll('[data-act="cx-meds"]').forEach(b => b.classList.toggle('btn-a', b === el));
      break; }
    case 'cancel-go': cancelGo(m); break;
    /* modal */
    case 'close-modal': (m || el.closest('.mask'))?.remove(); break;
    /* counter */
    case 'c-login': { const u = await counterLogin('#cl-id','#cl-pw','#cl-err', false); if (u) { S.cUser = u; cShow(); } break; }
    case 'c-logout': S.cUser = null; $('#c-main').style.display='none'; $('#c-login').style.display='block'; break;
    case 'c-menu': {
      S.cView = el.dataset.v;
      if (el.dataset.v === 'call') { const t = new Date(); t.setDate(t.getDate() + 1); S.cDate = fmtD(t); }
      renderCounter(); break; }
    case 'cc-tomorrow': { const t = new Date(); t.setDate(t.getDate() + 1); S.cDate = fmtD(t); renderCounter(); break; }
    case 'cc-initonly': S.ccInitOnly = !S.ccInitOnly; renderCounter(); break;
    case 'cc-mark': {
      const a = (window.__ccIndex || [])[+el.dataset.i];
      if (!a) break;
      el.disabled = true;
      const ok = await markAppt(a, el.dataset.op);
      if (ok) loadCCall(); else el.disabled = false;
      break; }
    case 'cd-nav': { const d = new Date(S.cDate+'T00:00'); d.setDate(d.getDate() + +el.dataset.d); S.cDate = fmtD(d); renderCounter(); break; }
    case 'cd-today': S.cDate = fmtD(new Date()); renderCounter(); break;
    case 'cd-sess': S.cSession = el.dataset.s; renderCounter(); break;
    case 'cd-refresh': S.apptCache.clear(); renderCounter(); break;
    case 'cd-mode': S.cMode = el.dataset.m; renderCounter(); break;
    case 'cd-pill': openMiniCal(); break;
    case 'mc-nav': {
      const mm = el.closest('.mask');
      let y = +mm.dataset.y, mo = +mm.dataset.m + +el.dataset.d;
      if (mo < 1) { mo = 12; y--; } if (mo > 12) { mo = 1; y++; }
      mm.dataset.y = y; mm.dataset.m = mo;
      renderMiniCal(mm); break; }
    case 'mc-pick': S.cDate = el.dataset.ds; closeModals(); renderCounter(); break;
    case 'cw-appt': {
      const a = (window.__cwIndex || {})[el.dataset.k];
      if (a) openApptDetailFromObj(a, el.dataset.k.split('|')[0]);
      break; }
    case 'appt-detail': openApptDetail(el.dataset.k); break;
    case 'cd-mark': {
      const a = window.__cdCurAppt;
      if (!a) break;
      el.disabled = true;
      const ok = await markAppt(a, el.dataset.op);
      if (ok) { closeModals(); renderCounter(); }
      else el.disabled = false;
      break; }
    case 'c-checkin': cAction(m, 'checkin'); break;
    case 'c-cancel': cAction(m, 'cancel'); break;
    case 'c-resch': cAction(m, 'resch'); break;
    case 'q-book': quickBook(); break;
    case 'cf-go': counterFind(); break;
    /* admin */
    case 'a-login': { const u = await counterLogin('#al-id','#al-pw','#al-err', true);
      if (u) { S.aUser = u; aShow(); } break; }   // 權限暫全開，之後再依職位收斂
    case 'a-logout': S.aUser = null; $('#a-main').style.display='none'; $('#a-login').style.display='block'; break;
    case 'a-menu': S.aView = el.dataset.v; renderAdmin(); break;
    case 'a-sync': aSync(el); break;
    case 'ord-move': {
      const i = +el.dataset.i, d2 = +el.dataset.d, to = i + d2;
      if (to < 0 || to >= S.ordDraft.length) break;
      [S.ordDraft[i], S.ordDraft[to]] = [S.ordDraft[to], S.ordDraft[i]];
      renderAdmin(); break; }
    case 'ord-save': {
      el.disabled = true;
      const res = await api.post('saveDoctorOrder', { order: S.ordDraft, titles: S.ordTitlesDraft || {}, by: S.aUser.name }, true);
      if (res.ok) { S.docOrder = [...S.ordDraft]; S.docTitles = { ...(S.ordTitlesDraft || {}) }; applyDoctorOrder(); toast('✓ 排序與職稱已儲存，前台立即生效'); renderAdmin(); }
      else toast('儲存失敗：' + (res.error || '後端未部署 saveDoctorOrder'), 'var(--red)');
      el.disabled = false; break; }
    case 'ord-reset': {
      if (!confirm('確定回到預設排序？（總院長優先＋院區順序）')) break;
      const res = await api.post('resetDoctorOrder', {}, true);
      if (res.ok) { S.docOrder = []; S.docTitles = {}; S.ordDraft = null; S.ordTitlesDraft = null; applyDoctorOrder(); toast('✓ 已回到預設排序與職稱'); renderAdmin(); }
      else toast('重設失敗：' + (res.error || ''), 'var(--red)');
      break; }
    case 'tc-uni': {
      const tr = el.closest('tr');
      tr.querySelector('.tc-i').value = tr.querySelector('.tc-f').value;
      toast('已把初診設為與複診相同，記得按「儲存」', 'var(--blue)');
      break; }
    case 'tc-save': {
      const tr = el.closest('tr');
      const d = el.dataset.d;
      const initMin = +tr.querySelector('.tc-i').value, followMin = +tr.querySelector('.tc-f').value;
      if (!(initMin >= 5 && followMin >= 5)) { toast('分鐘數需 ≥ 5', 'var(--amber)'); break; }
      const res = await api.post('saveTimeSetting', { doctor:d, initMin, followMin, by:S.aUser.name }, true);
      if (res.ok) { S.timeCfg.overrides[d] = { initMin, followMin }; toast(`✓ ${d}：初診 ${initMin} / 複診 ${followMin} 分`); renderAdmin(); }
      else toast('儲存失敗：'+(res.error||'後端未部署 saveTimeSetting'), 'var(--red)');
      break; }
    case 'tc-reset': {
      const d = el.dataset.d;
      const res = await api.post('deleteTimeSetting', { doctor:d }, true);
      if (res.ok) { delete S.timeCfg.overrides[d]; toast(`✓ ${d} 已回公版`); renderAdmin(); }
      break; }
    case 'as-filter': {
      const c = $('#as-clinic').value, d = normDoc($('#as-doc').value);
      let rows = S.schedules;
      if (c) rows = rows.filter(s => s.clinic === c);
      if (d) rows = rows.filter(s => normDoc(s.doctor).includes(d));
      $('#as-tbl').innerHTML = schedTable(rows.slice(0, 500)); break; }
    case 'ar-go': aReport(); break;
  }
});
/* change 事件（櫃台院區切換） */
document.addEventListener('change', e => {
  if (e.target.id === 'cd-clinic') { S.cClinic = e.target.value; renderCounter(); }
  if (e.target.classList && e.target.classList.contains('ord-title')) {
    S.ordTitlesDraft[e.target.dataset.n] = e.target.value;
    renderAdmin();
  }
});
function captureF4() {
  const g = id => $(id) ? $(id).value.trim() : '';
  S.bk.name = g('#f-name') || S.bk.name;
  S.bk.phone = g('#f-phone') || S.bk.phone;
  S.bk.idNo = g('#f-id') || S.bk.idNo;
  const rem = $('#f-rem'); if (rem) S.bk.remember = rem.checked;
  S.bk.items = [...document.querySelectorAll('.f-item:checked')].map(x => x.value);
}
/* Enter 快捷（登入框） */
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  if (e.target.id === 'cl-pw') $('[data-act="c-login"]').click();
  if (e.target.id === 'al-pw') $('[data-act="a-login"]').click();
  if (['lk-name','lk-phone','lk-id'].includes(e.target.id)) $('[data-act="lk-go"]').click();
});
/* 頁面重新可見時，若快取過期則背景刷新（取代輪詢） */
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && Date.now() - S.loadedAt > CFG.CACHE_TTL) refreshSchedulesInBg();
});
boot();
</script>
</body>
</html>
